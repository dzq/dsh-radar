name: Update Daily

on:
  # 每天 UTC 01:00（北京时间 09:00）自动跑
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-data.mjs'
      - 'scripts/lib/score.mjs'

concurrency:
  group: dsh-radar-daily
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm + GitHub
        uses: actions/cache@v4
        with:
          path: data/.cache
          key: cache-data-${{ runner.os }}-${{ hashFiles('scripts/**') }}
          restore-keys: |
            cache-data-${{ runner.os }}-

      - name: Fetch + score plugins (incremental)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: '0'
        run: node scripts/build-data.mjs

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Build authors index
        run: node scripts/build-authors.mjs

      - name: Build changelog
        run: node scripts/build-changelog.mjs

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: daily refresh [skip ci]'
          file_pattern: 'data/**'

  build-web:
    needs: update-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --cache /tmp/npm-cache || npm install --cache /tmp/npm-cache

      - name: Build
        working-directory: web
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
