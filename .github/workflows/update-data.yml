name: Update DSH Radar data

on:
  schedule:
    # 每周 UTC 时间周一 00:00（北京时间 08:00）跑
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'

# 允许一个 workflow run 同时进行（避免并发冲突）
concurrency:
  group: dsh-radar-update
  cancel-in-progress: false

jobs:
  # Job 1: 抓取并评分所有插件
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 让 git-auto-commit 能 push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要历史才能 git diff changelog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm metadata + GitHub responses
        uses: actions/cache@v4
        with:
          path: |
            data/.cache
          key: cache-data-${{ runner.os }}-${{ hashFiles('scripts/**') }}
          restore-keys: |
            cache-data-${{ runner.os }}-

      - name: Fetch + score plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: '0'   # 0 = 全量；CI 首次可设 200 控量
        run: node scripts/build-data.mjs

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Build authors index
        run: node scripts/build-authors.mjs

      - name: Build changelog
        run: node scripts/build-changelog.mjs

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: refresh plugin scores [skip ci]'
          file_pattern: 'data/**'

  # Job 2: 构建 Astro 站点
  build-web:
    needs: build-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --cache /tmp/npm-cache || npm install --cache /tmp/npm-cache

      - name: Build site
        working-directory: web
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.PUBLIC_PLAUSIBLE_DOMAIN }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  # Job 3: 部署到 GitHub Pages
  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write      # 部署到 Pages
      id-token: write   # OIDC 验证
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
